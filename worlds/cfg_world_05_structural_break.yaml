world_name: cfg_world_05_structural_break
description: >
  World 05 — Structural Break & Strategic Transformation:
  Major structural break midway through history (Week 78). Six new Tier-1 and Tier-2 cold-chain
  distribution territories are unlocked simultaneously with the commercial scale-up of the Mycelium
  product line (SKU-MYC-500G) moving from pilot into regular production. The company's total addressable
  market, capacity ceiling, and product revenue mix permanently shift in the second half of history.

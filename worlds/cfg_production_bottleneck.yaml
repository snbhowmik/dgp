world_name: cfg_production_bottleneck
description: >
  Chronic production uncertainty and severe supply bottleneck. Higher base bioreactor failure
  and contamination rates (7% fail, 12% partial), punctuated by a severe monsoon media contamination
  shock between Weeks 60 and 70. Forces emergency co-manufacturing activation at premium costs.
  Demand frequently crashes against the hard output ceiling, creating widespread order waitlisting and stockouts.

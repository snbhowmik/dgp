  balanced B2B wholesale and D2C channels, standard Indian festive seasonality (Diwali/Navratri),
  well-managed bioreactor batches with nominal yield variability (4% failure, 7% partial),
  and orderly co-manufacturing buffer. Represents healthy, well-run commercial scale-up.

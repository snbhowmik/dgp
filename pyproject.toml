[project]
name = "biokraft-dgp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "snbhowmik", email = "connect@snbhowmik.dev" }
]
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6.0.3",
]

[project.scripts]
dgp = "dgp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dgp"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
